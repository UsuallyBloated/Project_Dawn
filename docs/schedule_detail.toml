risk = "Thirteen hours of checklist sittings, all the user's"
impact = "Built is not done. If week 1 runs short, the ticks wait and the To-Do keeps saying pending."
mitigation = "Run the solo sittings first; the two-seat sections can bundle into one two-boxed evening and slide into week 2 without moving anything else."

[[risk]]
risk = "The bump day strands anyone on the old client"
impact = "A tester who misses the message cannot log in and may think the server is down."
mitigation = "Pick an evening, tell everyone a week ahead (d5), send the zip within the hour, keep the old server build to hand for one day."

[[risk]]
risk = "A client-side fix after the pre-door check"
impact = "A new zip for every friend already onboarded, days before the door opens."
mitigation = "Prefer server-side fixes in week 5; hold any export to one, before the rest of the group is onboarded."

[[risk]]
risk = "Two live bugs on the hosted server today"
impact = "A friend can attack a creature with spells from beyond its reaction range, and Charm may end at once; either reads as a broken game."
mitigation = "Step 0 closes both; nobody but the user is in the world before October 22 anyway."

[[risk]]
risk = "The trade window is the largest change ever merged in one evening"
impact = "A dupe or a loss here loses a tester permanently."
mitigation = "Built to its ten-point exploit ledger with the suites green on the branch (255 unit and 70 integration tests on October 5); its checklist runs before any friend trades."

