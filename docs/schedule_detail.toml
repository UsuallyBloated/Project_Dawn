# The plan behind docs/schedule_detail.md and docs/schedule_detail.html.
#
# This file is the only thing a person edits. `python tools/schedule_detail.py` reads it,
# reads the CLAUDE.md To-Do and every checklist in docs/playtest_notes/, and rewrites both
# detail files. It refuses to write if a row points at a checklist or To-Do entry that no
# longer exists, and it reports open checklists that no row schedules.
#
# Rules this file lives by (the 2026-09-09 schedule rule, extended to the detail):
#   - Rows carry dates, sequence, owner, needs and dependencies. Never status. The verdict
#     on a row lives in the checklist it names, or in the To-Do entry it names.
#   - Every estimate traces to evidence (schedule.md section 1, the spell batch plan file,
#     checklist row counts) or is listed under [[assumption]].
#   - A row that waits on an approval or a decision is `tentative = true`.
#
# Row fields:
#   id, week, lane (build | operate | verify | people | decide), what, who,
#   needs (list of strings), hours (user time) or days (Claude build time),
#   waits_on (list of row ids), done_when, checklist (file in docs/playtest_notes/),
#   checklist_branch (when the file is only on a git branch), todo (an exact phrase from
#   a CLAUDE.md To-Do entry title), tentative, day (free text placing it in the week),
#   by (decide rows: the date it starts to block), blocks (decide rows), milestone (id).

[meta]
title = "Project Dawn: Week by Week to the Friends Build"
start = 2026-10-05
target = 2026-11-19
hours_per_week = 30
minutes_per_checklist_row = 6
stale_checklist_days = 30
published_url = "https://claude.ai/artifact/8V2D15TKBpYd88miTmTfhM"
plan_file = "docs/design/spell_batch_plan_2026_10_05.md"

# ---------------------------------------------------------------------------------------
# Assumptions. Each is a number the layout depends on and its source.

[[assumption]]
text = "A checklist row takes about six minutes to run, so a sitting of 15 to 20 rows is one and a half to two hours."
source = "This project's own sittings (handoff note, 2026-10-05); phase 4's 28 rows ran across five sittings."

[[assumption]]
text = "A redeploy costs the user about fifteen minutes and takes the world down for about two minutes. Everyone online loses up to a minute of progress, so people log out first."
source = "docs/deployment/server_operations.md; the 2026-10-05 redeploy was down about two minutes."

[[assumption]]
text = "An export plus zipping and sending it costs about an hour of the user's time. No export has been timed; this is a guess."
source = "Assumption."

[[assumption]]
text = "Build steps are laid out at roughly half the pace the plan file estimates, with a review pass folded into each. That is the schedule's own rule (two-week windows for work measured at three days), because the history holds real gaps of three and ten days."
source = "docs/schedule.md section 1; docs/design/spell_batch_plan_2026_10_05.md step estimates."

[[assumption]]
text = "Onboarding one friend costs the user about thirty minutes (share link, zip, README, check the account list), plus the friend's own install time."
source = "docs/deployment/inviting_a_player.md, steps 2 to 5."

[[assumption]]
text = "The user has about thirty hours a week. Weeks here never schedule more than half of it, because the pile of unverified work has been the recurring risk, not a shortage of plans."
source = "docs/schedule.md header."

[[assumption]]
text = "Every date here except November 19 is a proposal. The milestones were placed by working back from November 8 at the measured pace with the fifth week left as slack; on November 5 the door moved to Thursday November 12 (the friends are busy on the 8th) and the user put the November bump in front of it, so a sixth week holds the door. On November 13 it moved a fourth time, to Thursday November 19: the invites had not gone out, and the week sends the share links early and runs the last pre-door rows, so a seventh week holds the door."
source = "The handoff's instruction; docs/schedule.md section 1."

# ---------------------------------------------------------------------------------------
# Glossary for a reader who does not work in the repo.

[[glossary]]
term = "The R720"
meaning = "The physical server in the basement that runs the game for everyone. Reachable only over Tailscale, a private network each tester joins once."

[[glossary]]
term = "Redeploy"
meaning = "Putting a new server build on the R720. The user's job, about fifteen minutes; the world is down about two minutes. A server change reaches players only this way."

[[glossary]]
term = "Export"
meaning = "Building a new game client (the program testers run) from the Godot editor, then zipping it and sending it. A client change reaches players only this way; the server needs nothing."

[[glossary]]
term = "Protocol bump"
meaning = "A change to the language the client and server speak. Afterwards an old client cannot connect at all, so the server and the new client must change on the same evening and every tester needs the new zip."

[[glossary]]
term = "Second seat (two-boxing)"
meaning = "A row that needs two players in the world at once. The user can run two accounts on one machine, so no friend is required for these."

[[glossary]]
term = "Checklist"
meaning = "A file in docs/playtest_notes/ with one row per thing to try in the game. Filling it is how built work becomes done. The counts on this page are rows still to run; the verdicts live in the file."

[[glossary]]
term = "The To-Do"
meaning = "The list in CLAUDE.md. The only place an item's status lives. Nothing on this page says whether something passed."

[[glossary]]
term = "GM"
meaning = "The one account with developer tools (spawn a creature, grant a level, give an item). Only the user's account has it; friends never do."

[[glossary]]
term = "Tentative"
meaning = "Work that waits on an approval or a decision. Shown so the whole picture is visible, styled differently so it is never mistaken for a commitment."

