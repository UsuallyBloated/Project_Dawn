title = "The door, a week later"
summary = "Added November 13: the user held the invites back on the 12th, so the door is Thursday the 19th. Early in the week the pre-door rerun's last rows run on the zip, then the share links, the zip and the players' checklist go out to all four (the plan's own advice from October: the network part settled days before the evening), and Thursday evening the door opens."

