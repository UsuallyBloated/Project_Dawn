[[week]]
id = "w6"
starts = 2026-11-09
title = "The door, on a Thursday"
summary = "Added November 5: the friends are busy on Sunday the 8th, so the door is Thursday the 12th, and the user spent the four days on the November bump rather than holding it until after. The bump's sheets finish early in the week, the pre-door check runs again on the build the friends will hold, the last zip goes out, and Thursday evening the door opens. Redrawn November 13: the sheets, the rerun, the last zip and the players' checklist happened, but the invites had not gone out, so the door moved to the next Thursday and the week ends with the zip made and unsent."

[[week]]
id = "w7"
