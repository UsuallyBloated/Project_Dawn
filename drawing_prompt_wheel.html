<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dawn · Drawing Prompt Wheel</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0a14;
      background-image: radial-gradient(ellipse 80% 60% at 50% 0%, #1a1028 0%, #0d0a14 65%);
      color: #e8d5a3;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 20px 56px;
    }

    header { text-align: center; margin-bottom: 24px; }

    h1 {
      font-size: 2rem;
      color: #c9a227;
      text-shadow: 0 0 28px rgba(201,162,39,.5), 0 0 60px rgba(201,162,39,.18);
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #5a4a2a;
      font-style: italic;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .wheel-wrap {
      position: relative;
      width: 520px;
      height: 520px;
    }

    .pointer {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 34px solid #c9a227;
      filter: drop-shadow(0 3px 10px rgba(201,162,39,.85));
      z-index: 10;
    }

    canvas { display: block; }

    #spin-btn {
      margin-top: 22px;
      padding: 12px 50px;
      background: linear-gradient(180deg, #4a1e1e, #1e0a0a);
      color: #c9a227;
      font-family: Georgia, serif;
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 5px;
      text-transform: uppercase;
      border: 2px solid #7a5814;
      border-radius: 3px;
      cursor: pointer;
      transition: background .2s, border-color .2s, box-shadow .2s;
      box-shadow: 0 0 18px rgba(201,162,39,.12), inset 0 1px 0 rgba(201,162,39,.08);
      outline: none;
    }
    #spin-btn:hover:not(:disabled) {
      background: linear-gradient(180deg, #5c2828, #2a1010);
      border-color: #c9a227;
      box-shadow: 0 0 30px rgba(201,162,39,.3);
    }
    #spin-btn:active:not(:disabled) { transform: translateY(1px); }
    #spin-btn:disabled { opacity: .4; cursor: not-allowed; }

    #result {
      margin-top: 26px;
      width: 100%;
      max-width: 520px;
      min-height: 120px;
    }

    .card {
      background: linear-gradient(150deg, #160f26, #0d0a14);
      border: 1px solid #6a5014;
      border-radius: 6px;
      padding: 24px 32px;
      text-align: center;
      box-shadow: 0 0 36px rgba(201,162,39,.1);
      animation: cardIn .4s ease forwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px) scale(.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    .card-label {
      font-size: .7rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #4a3a1e;
      margin-bottom: 10px;
    }

    .card-name {
      font-size: 2rem;
      color: #c9a227;
      text-shadow: 0 0 18px rgba(201,162,39,.4);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .card-desc {
      font-size: .9rem;
      color: #9a7850;
      font-style: italic;
      line-height: 1.65;
    }

    .card-foot {
      margin-top: 12px;
      font-size: .68rem;
      color: #342616;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <h1>Drawing Prompt Wheel</h1>
  <p class="subtitle">Project Dawn &mdash; Item Compendium</p>
</header>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <canvas id="wheel" width="520" height="520"></canvas>
</div>

<button id="spin-btn">Spin</button>
<div id="result"></div>

const SEGS    = 12;
const CX = 260, CY = 260, R = 232, HUB = 42;

const PALETTE = [
  '#5C1010','#0E2A0E','#10104A','#2A0A4A',
  '#0A3530','#3A2808','#1C1C2E','#1A0C28',
  '#182A08','#3A0A1C','#0A1A2C','#2E1808'
];

const canvas = document.getElementById('wheel');
const ctx    = canvas.getContext('2d');
const btn    = document.getElementById('spin-btn');
const result = document.getElementById('result');

let currentAngle = 0;
let segments     = [];
let spinning     = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function drawWheel(angle) {
  ctx.clearRect(0, 0, 520, 520);
  const seg = (2 * Math.PI) / SEGS;

  // outer ambient glow
  const glow = ctx.createRadialGradient(CX, CY, R - 8, CX, CY, R + 14);
  glow.addColorStop(0, 'rgba(201,162,39,0.2)');
  glow.addColorStop(1, 'rgba(201,162,39,0)');
  ctx.beginPath();
  ctx.arc(CX, CY, R + 14, 0, 2 * Math.PI);
  ctx.fillStyle = glow;
  ctx.fill();

  for (let i = 0; i < SEGS; i++) {
    const a0  = angle + i * seg;
    const a1  = a0 + seg;
    const mid = a0 + seg / 2;

    // fill
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();

    // radial depth gradient overlay
    const depth = ctx.createRadialGradient(CX, CY, HUB, CX, CY, R);
    depth.addColorStop(0, 'rgba(255,255,255,0.05)');
    depth.addColorStop(1, 'rgba(0,0,0,0.20)');
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = depth;
    ctx.fill();

    // divider lines
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, a0, a1);
    ctx.closePath();
    ctx.strokeStyle = 'rgba(201,162,39,0.32)';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // segment text
    if (segments[i]) {
      const tx  = CX + Math.cos(mid) * R * 0.62;
      const ty  = CY + Math.sin(mid) * R * 0.62;
      const rot = Math.sin(mid) > 0 ? mid - Math.PI / 2 : mid + Math.PI / 2;

      ctx.save();
      ctx.translate(tx, ty);
      ctx.rotate(rot);
      ctx.fillStyle  = 'rgba(232,213,163,0.85)';
      ctx.font       = 'bold 10px Georgia';
      ctx.textAlign  = 'center';
      ctx.textBaseline = 'middle';

      const words = segments[i][0].split(' ');
      if (words.length === 1) {
        ctx.fillText(words[0], 0, 0);
      } else if (words.length === 2) {
        ctx.fillText(words[0], 0, -6);
        ctx.fillText(words[1], 0,  6);
      } else {
        const h = Math.ceil(words.length / 2);
        ctx.fillText(words.slice(0, h).join(' '), 0, -6);
        ctx.fillText(words.slice(h).join(' '),    0,  6);
      }
      ctx.restore();
    }
  }

  // outer border ring
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2 * Math.PI);
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth   = 3;
  ctx.stroke();

  // hub background
  const hubG = ctx.createRadialGradient(CX, CY, 0, CX, CY, HUB);
  hubG.addColorStop(0, '#2a1a08');
  hubG.addColorStop(1, '#0d0a14');
  ctx.beginPath();
  ctx.arc(CX, CY, HUB, 0, 2 * Math.PI);
  ctx.fillStyle   = hubG;
  ctx.fill();
  ctx.strokeStyle = '#c9a227';
  ctx.lineWidth   = 2;
  ctx.stroke();

  // hub ornament
  ctx.fillStyle    = '#c9a227';
  ctx.font         = '22px Georgia';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✦', CX, CY);
}

function easeOut(t) {
  return 1 - Math.pow(1 - t, 4);
}

function spin() {
  if (spinning) return;
  spinning = true;
  btn.disabled = true;
  result.innerHTML = '';

  // pick winner from full pool
  const wi     = Math.floor(Math.random() * ITEMS.length);
  const winner = ITEMS[wi];

  // build 12 visible segments, winner at a random slot
  const pool = shuffle(ITEMS.filter((_, i) => i !== wi));
  const slot = Math.floor(Math.random() * SEGS);
  segments = [
    ...pool.slice(0, slot),
    winner,
    ...pool.slice(slot, SEGS - 1)
  ];

  // target: winner slot midpoint lands at pointer (top = -PI/2)
  const segAngle  = (2 * Math.PI) / SEGS;
  const targetBase = -Math.PI / 2 - (slot + 0.5) * segAngle;
  let delta = ((targetBase - currentAngle) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
  if (delta < 0.1) delta += 2 * Math.PI;

  const extraSpins = 5 + Math.floor(Math.random() * 4);
  const endAngle   = currentAngle + delta + extraSpins * 2 * Math.PI;
  const duration   = 4200 + Math.random() * 1600;
  const startAngle = currentAngle;
  let   startTime  = null;

  function frame(ts) {
    if (!startTime) startTime = ts;
    const t = Math.min((ts - startTime) / duration, 1);
    currentAngle = startAngle + (endAngle - startAngle) * easeOut(t);
    drawWheel(currentAngle);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      currentAngle = endAngle;
      spinning     = false;
      btn.disabled = false;
      showResult(winner);
    }
  }

  requestAnimationFrame(frame);
}

function showResult([name, desc]) {
  result.innerHTML = `
    <div class="card">
      <div class="card-label">Your Drawing Prompt</div>
      <div class="card-name">${name}</div>
      <div class="card-desc">${desc}</div>
      <div class="card-foot">${ITEMS.length} items &mdash; Project Dawn</div>
    </div>`;
}

btn.addEventListener('click', spin);

// initial render
segments = shuffle(ITEMS).slice(0, SEGS);
drawWheel(currentAngle);
</script>
